name: CI

# Full verification on every PR and on pushes to main. Mirrors the local
# checks: typecheck (library + example), tests, the library build + a
# packaging dry-run, and the demo build (Pages parity).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (informational — dev-only advisories don't block)
        run: pnpm audit
        continue-on-error: true
      - name: Type-check library
        run: pnpm run typecheck
      - name: Type-check example
        run: pnpm exec tsc --noEmit -p examples/tsconfig.json
      - name: Test
        run: pnpm run test
      - name: Build library
        run: pnpm run build
      - name: Verify package contents (no src, ships dist + LICENSE + README)
        run: pnpm pack --dry-run
      - name: Build demo (Pages parity)
        run: pnpm run --filter interconnection-atlas-examples build
