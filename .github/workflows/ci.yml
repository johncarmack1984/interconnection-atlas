name: CI

# Full verification on every PR and on pushes to main. Mirrors the local
# checks: typecheck (library + example), tests, the library build + a
# packaging dry-run, and the demo build (Pages parity).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
      - run: bun install --frozen-lockfile
      - name: Audit dependencies (informational — dev-only advisories don't block)
        run: bun audit
        continue-on-error: true
      - name: Type-check library
        run: bun run typecheck
      - name: Type-check example
        run: bunx tsc --noEmit -p examples/tsconfig.json
      - name: Test
        run: bun run test
      - name: Build library
        run: bun run build
      - name: Verify package contents (no src, ships dist + LICENSE + README)
        run: npm pack --dry-run
      - name: Build demo (Pages parity)
        run: bun run --filter interconnection-atlas-examples build
