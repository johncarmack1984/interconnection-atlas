version: 2
updates:
  # Keep the pinned GitHub Actions current (and flag tag → newer-version bumps).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # Surface dependency advisories (e.g. the dev-only xlsx CVE) as update PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must be the exact same version at runtime (#31 bumped
      # react alone and every render test failed), so they move with their types.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # @types/node tracks the runtime major: CI runs on lts/*, so a newer major
      # waits for the LTS line to move, and a PR moves it when it does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
