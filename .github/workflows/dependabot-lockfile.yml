name: Dependabot pnpm lockfile

# Dependabot bumps package.json but doesn't maintain pnpm-lock.yaml, so its npm PRs
# fail `pnpm install --frozen-lockfile` (this is what sank the first batch). This
# regenerates pnpm-lock.yaml and commits it back to the PR branch, so CI re-runs
# against a synced lockfile and the PR can merge.
#
# Security:
#   - pull_request_target gives GITHUB_TOKEN write access to push to the PR
#     branch (a plain pull_request token is read-only for Dependabot).
#   - Gated to dependabot[bot]: any other PR runs under its author's actor, so it
#     cannot trigger this.
#   - The paths filter limits it to dependency PRs, and the pnpm-lock.yaml-only commit
#     doesn't match that filter, so it never re-triggers itself (no loop).
#   - pnpm skips untrusted packages' lifecycle scripts on install, so a bumped dep
#     can't run code against the token.
on:
  pull_request_target:
    paths:
      - "package.json"
      - "**/package.json"

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm      
      - name: Regenerate pnpm-lock.yaml from the bumped package.json
        run: pnpm install
      - name: Commit the refreshed lockfile if it changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already in sync — nothing to do."
          else
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Regenerate pnpm-lock.yaml"
            git push
          fi
